name: floci
services:
  floci:
    image: floci/floci:latest
    container_name: floci
    restart: unless-stopped
    ports:
      - "127.0.0.1:4566:4566"             # the AWS API (all services)
      - "127.0.0.1:7001-7099:7001-7099"   # RDS databases
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # lets Floci run ECS/EC2/RDS containers
      - floci-data:/app/data
    environment:
      FLOCI_DEFAULT_REGION: us-west-2     # the course hardcodes us-west-2
      FLOCI_STORAGE_MODE: persistent      # survive restarts
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      # ECR addresses as localhost:4566/<account>/<region>/<repo>.
      # The default *.localhost hostnames don't resolve on this server.
      FLOCI_SERVICES_ECR_URI_STYLE: path
      # The Docker network for containers Floci starts. ECS needs one that isn't the default bridge.
      FLOCI_SERVICES_DOCKER_NETWORK: floci_default
      FLOCI_SERVICES_ECS_DOCKER_NETWORK: floci_default
volumes:
  floci-data:
